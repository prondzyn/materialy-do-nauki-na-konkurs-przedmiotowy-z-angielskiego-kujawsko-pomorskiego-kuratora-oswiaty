<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konkurs z angielskiego — materiały</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
    --soft: #f6f8fa; --link: #0969da; --accent: #9a6700; --bubble: #fff8c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d;
      --soft: #151b23; --link: #4493f8; --accent: #d29922; --bubble: #3b2e00;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* Nagłówek przyczepiony do góry strony (razem ze spisem działów) */
  header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); background: var(--soft); }
  h1, h2, h3, h4 { scroll-margin-top: calc(var(--hdr, 50px) + 12px); }
  header nav, main { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  header nav { padding-top: 10px; padding-bottom: 10px; font-size: 14px; }
  /* Spis działów na podstronach zadań */
  #dzialy { border-top: 1px solid var(--line); }
  #dzialy ol {
    max-width: 900px; margin: 0 auto; padding: 6px 16px; list-style: none;
    display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 13px;
  }
  #dzialy li { margin: 0; }
  /* Na telefonie działy w jednym przewijanym wierszu, żeby pasek nie zajmował pół ekranu */
  @media (max-width: 700px) {
    #dzialy ol { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  }
  #dzialy a, #dzialy span {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  #dzialy a:hover { background: var(--soft); text-decoration: none; }
  #dzialy span { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .prevnext { display: flex; justify-content: space-between; gap: 12px; margin-top: 3em;
    padding-top: 1em; border-top: 1px solid var(--line); font-size: 15px; }
  main { padding-top: 8px; padding-bottom: 64px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2 { border-bottom: 1px solid var(--line); padding-bottom: .3em; }
  h1 { font-size: 1.9em; } h2 { font-size: 1.45em; margin-top: 1.8em; }
  code { background: var(--soft); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
  blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--line); }
  table { border-collapse: collapse; margin: 1em 0; max-width: 100%; }
  th, td { border: 1px solid var(--line); padding: 6px 12px; vertical-align: top; }
  th { background: var(--soft); }
  /* Zwykłe tabelki przewijają się w poziomie same, a nie razem z całą stroną.
     Ramki z wyrazami (ze słówkami) nie, bo przewijanie ucinałoby dymki z tłumaczeniem. */
  table:not(:has(.slowko)) { display: block; overflow-x: auto; }
  @media (max-width: 700px) {
    /* Ramka na telefonie: komórki zawijają się do kolejnych wierszy */
    table:has(.slowko) { display: block; border: 1px solid var(--line); padding: 4px; }
    table:has(.slowko) tbody { display: flex; flex-wrap: wrap; gap: 4px; }
    table:has(.slowko) tr { display: contents; }
    table:has(.slowko) td { display: block; padding: 4px 8px; }
  }
  li { margin: .25em 0; }
  /* „odpowiedź” zawsze w osobnej linii pod pytaniem; po rozwinięciu odpowiedź w ramce pod spodem */
  details { display: block; width: fit-content; max-width: 100%; margin: .1em 0 .4em; }
  details + br { display: none; }
  summary { cursor: pointer; color: var(--muted); font-size: .9em; width: fit-content; }
  details[open] {
    padding: .25em .75em .35em; background: var(--soft);
    border-left: 3px solid var(--accent); border-radius: 4px;
  }
  details[open] summary { color: var(--accent); margin-bottom: .15em; }
  /* Wyraz bazowy w słowotwórstwie (<kbd>SMOKE</kbd>) */
  kbd {
    font: 600 .85em/1.4 ui-monospace, Consolas, monospace; letter-spacing: .03em;
    color: var(--accent); background: var(--soft); border: 1.5px solid var(--accent);
    border-radius: 5px; padding: .05em .45em; white-space: nowrap;
  }
  kbd .say { font-size: .95em; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  #error { color: #cf222e; }

  /* Słówka z tłumaczeniem i wymową */
  .slowko { position: relative; white-space: nowrap; }
  .slowko .word {
    font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
    border-bottom: 2px dotted var(--accent);
  }
  .say {
    font-size: .8em; background: none; border: 0; padding: 0 0 0 .2em; cursor: pointer;
    opacity: .75; vertical-align: baseline;
  }
  .say:hover { opacity: 1; }
  .slowko .tr {
    position: absolute; left: 0; top: 100%; z-index: 10; margin-top: 4px;
    background: var(--bubble); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; font-size: .9em; font-weight: normal; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .slowko .tr[hidden] { display: none; }

  /* Zadania interaktywne */
  :root { --ok: #1a7f37; --ok-bg: rgba(46,160,67,.18); --bad: #cf222e; --bad-bg: rgba(248,81,73,.15); }
  @media (prefers-color-scheme: dark) { :root { --ok: #3fb950; --bad: #f85149; } }
  .opt { cursor: pointer; border-radius: 4px; padding: 0 .35em; margin-left: -.35em; }
  li.opt { width: fit-content; }
  .opt:hover { background: var(--soft); }
  .opt.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .opt.bad { background: var(--bad-bg); text-decoration: line-through; opacity: .75; }
  .done .opt:not(.ok) { cursor: default; }
  .pick {
    font: inherit; font-weight: 600; color: var(--link); background: var(--soft);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 .4em; white-space: nowrap;
  }
  .pickword { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: inherit; }
  .pick .say { display: inline-block; }   /* bez przekreślenia przy złej odpowiedzi */
  .pick.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
  .pick.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); text-decoration: line-through; }
  .gapin {
    font: inherit; width: 7em; padding: 0 .3em; color: var(--fg); background: var(--bg);
    border: 0; border-bottom: 2px solid var(--muted); border-radius: 0; text-align: center;
  }
  .gapin:focus { outline: none; border-bottom-color: var(--link); background: var(--soft); }
  .gapin.ok { border-bottom-color: var(--ok); color: var(--ok); background: var(--ok-bg); font-weight: 600; }
  .gapin.bad { border-bottom-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
  td.used { opacity: .45; text-decoration: line-through; }
  /* Tekst do przeczytania w czytaniu — wyraźnie oddzielony od polecenia */
  .tekst {
    margin: 1.2em 0 1.6em; padding: .4em 1.4em 1em; border-radius: 8px;
    background: var(--soft); border: 1px solid var(--line); border-left: 5px solid var(--accent);
    font-family: Georgia, "Times New Roman", serif; font-size: 1.06em; line-height: 1.75;
  }
  .tekst::before {
    content: "TEKST DO PRZECZYTANIA"; display: block; margin: .6em 0 .2em;
    font: 700 .72em/1 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: .08em; color: var(--accent);
  }
  .tekst > p:first-of-type strong:not(:has(.pick)) { font-size: 1.15em; }
  /* Tekst z wyborem w lukach: więcej miejsca między liniami, żeby ramki nie nachodziły na siebie */
  .tekst p:has(.pick) { line-height: 2.3; }
  .tekst .pick { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: .9em; }
  /* Lista w luce: wąska, żeby nie łamała tekstu (rozwinięte opcje są w pełnej długości);
     po dobrym wyborze rozszerza się, żeby zdanie dało się przeczytać ze wstawionym fragmentem. */
  .gapsel {
    font: 600 .9em/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    width: 10.5em; max-width: 100%; color: var(--link); background: var(--soft);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 .2em; text-overflow: ellipsis;
  }
  .gapsel.ok { width: auto; color: var(--ok); background: var(--ok-bg); border-color: var(--ok); opacity: 1; }
  .gapsel.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
  /* Podkreślony fragment (pytania o podkreślony fragment) */
  u {
    font-weight: 700; color: var(--accent); background: var(--bubble);
    border-radius: 4px; padding: 0 .3em;
    text-decoration: none;
  }
  .baza {
    font-weight: 700; color: var(--accent); background: var(--bubble);
    border-radius: 4px; padding: 0 .3em; white-space: nowrap;
  }
  .gapin.part { border-bottom-color: var(--accent); background: var(--bubble); }
  /* Kratki na litery (_ t _ i _) */
  .letters { display: inline-flex; gap: 2px; vertical-align: middle; padding: 2px; border-radius: 6px; }
  .lt {
    width: 1.5em; height: 1.75em; padding: 0; text-align: center; font: inherit; font-weight: 600;
    color: var(--fg); background: var(--bg); border: 1px solid var(--muted); border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  input.lt:focus { outline: none; border-color: var(--link); background: var(--soft); }
  .lt.fixed { background: var(--soft); color: var(--muted); border-style: dashed; }
  .letters.ok { background: var(--ok-bg); }
  .letters.ok .lt { border-color: var(--ok); color: var(--ok); }
  .letters.bad { background: var(--bad-bg); }
  .letters.bad input.lt { border-color: var(--bad); color: var(--bad); }
  #wynik-box { float: right; display: flex; gap: 10px; align-items: center; }
  #wynik { color: var(--muted); }
  #reset {
    font: inherit; font-size: 12px; color: var(--muted); background: none; cursor: pointer;
    border: 1px solid var(--line); border-radius: 12px; padding: 1px 9px;
  }
  #reset:hover { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>
<header><nav><span id="wynik-box"><span id="wynik" hidden></span><button type="button" id="reset" hidden title="Wyczyść zapisane odpowiedzi na tej stronie">Zresetuj postęp</button></span><a href="./">Strona główna</a> · <a href="?p=zadania-wg-typu/README.md">Zadania według typu</a></nav><nav id="dzialy" hidden aria-label="Działy"></nav></header>
<main id="content"><p>Wczytywanie…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const page = (params.get('p') || 'README.md').replace(/^\/+/, '');
  const baseDir = page.includes('/') ? page.slice(0, page.lastIndexOf('/') + 1) : '';
  const content = document.getElementById('content');

  function resolve(rel) {
    const parts = (baseDir + rel).split('/');
    const out = [];
    for (const p of parts) {
      if (p === '..') out.pop();
      else if (p !== '.' && p !== '') out.push(p);
    }
    return out.join('/');
  }

  // Taki sam identyfikator nagłówka jak na GitHubie, żeby działały linki z #kotwicą.
  function slug(text) {
    return text.trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s_-]/gu, '')
      .replace(/\s/g, '-');
  }

  function fixLinks(root) {
    root.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (/^([a-z]+:|#|\?)/i.test(href)) return;
      const [path, hash] = href.split('#');
      if (/\.md$/i.test(path)) {
        a.href = '?p=' + encodeURI(resolve(path)) + (hash ? '#' + hash : '');
      } else if (path) {
        a.href = encodeURI(resolve(path)) + (hash ? '#' + hash : '');
      }
    });
  }

  // --- wymowa (synteza mowy przeglądarki) ---
  const synth = window.speechSynthesis;
  let voice = null;
  // Tylko głosy brytyjskie (en-GB). Najlepiej brzmią głosy „Natural/Online” (Edge),
  // potem „Google UK English” (Chrome), potem systemowe (np. Daniel na iPhonie).
  // Amerykańskiego głosu celowo nie bierzemy nawet awaryjnie.
  function pickVoice() {
    const gb = (synth ? synth.getVoices() : []).filter(v => /^en[-_]GB$/i.test(v.lang));
    const rank = v => /natural|online/i.test(v.name) ? 0 : /google/i.test(v.name) ? 1 : 2;
    gb.sort((a, b) => rank(a) - rank(b));
    voice = gb[0] || null;
  }
  if (synth) { pickVoice(); synth.addEventListener('voiceschanged', pickVoice); }
  function say(text) {
    if (!synth) return;
    synth.cancel();
    // Słowa pisane WERSALIKAMI (np. UP, IN w ramkach) głos czytałby jak skróty.
    if (text === text.toUpperCase()) text = text.toLowerCase();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    if (voice) u.voice = voice;
    u.rate = 0.85;
    synth.speak(u);
  }

  // <span title="tłumaczenie">słowo</span>  →  słowo z ukrytym tłumaczeniem + 🔊
  function enhanceWords(root) {
    root.querySelectorAll('span[title]').forEach(span => {
      const word = span.textContent;
      const tr = span.getAttribute('title');
      const box = document.createElement('span');
      box.className = 'slowko';

      const w = document.createElement('button');
      w.type = 'button'; w.className = 'word'; w.textContent = word;
      w.setAttribute('aria-expanded', 'false');
      w.title = 'Pokaż tłumaczenie';

      const bubble = document.createElement('span');
      bubble.className = 'tr'; bubble.textContent = tr; bubble.hidden = true;

      w.addEventListener('click', e => {
        e.stopPropagation();
        const open = bubble.hidden;
        document.querySelectorAll('.slowko .tr').forEach(b => { b.hidden = true; });
        document.querySelectorAll('.slowko .word').forEach(b => b.setAttribute('aria-expanded', 'false'));
        bubble.hidden = !open;
        w.setAttribute('aria-expanded', String(open));
      });

      box.append(w);
      if (synth) {
        const s = document.createElement('button');
        s.type = 'button'; s.className = 'say'; s.textContent = '🔊';
        s.setAttribute('aria-label', 'Wymowa: ' + word);
        s.title = 'Posłuchaj wymowy';
        s.addEventListener('click', e => { e.stopPropagation(); say(word); });
        box.append(s);
      }
      box.append(bubble);
      span.replaceWith(box);
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('.slowko .tr').forEach(b => { b.hidden = true; });
    });
  }

  // --- spis działów na podstronach zadań ---
  const DZIALY = [
    ["01-kultura", "Kultura"], ["02-funkcje-jezykowe", "Funkcje językowe"],
    ["03-slownictwo-wybor", "Słownictwo — wybór"], ["04-gramatyka-wybor", "Gramatyka — wybór"],
    ["05-przyimki-i-czasowniki-frazalne", "Przyimki i frazale"], ["06-czytanie-ze-zrozumieniem", "Czytanie"],
    ["07-formy-czasownikow-w-nawiasach", "Formy czasowników"], ["08-slownictwo-uzupelnij-wyraz", "Uzupełnij wyraz"],
    ["09-slowotworstwo", "Słowotwórstwo"], ["10-pytania-o-podkreslony-fragment", "Pytania"],
    ["11-transformacje-i-tlumaczenia", "Transformacje"],
  ];
  function addSectionNav() {
    const m = page.match(/^zadania-wg-typu\/(.+)\.md$/);
    if (!m) return;
    const cur = DZIALY.findIndex(d => d[0] === m[1]);
    const nav = document.getElementById("dzialy");
    const ol = document.createElement("ol");
    DZIALY.forEach(([file, name], i) => {
      const li = document.createElement("li");
      const label = String(i + 1).padStart(2, "0") + " " + name;
      const el = document.createElement(i === cur ? "span" : "a");
      if (i !== cur) el.href = "?p=zadania-wg-typu/" + file + ".md";
      else el.setAttribute("aria-current", "page");
      el.textContent = label;
      li.append(el); ol.append(li);
    });
    nav.append(ol); nav.hidden = false;
    const curEl = ol.querySelector("[aria-current]");
    if (curEl) ol.scrollLeft = curEl.offsetLeft - 16;   // na telefonie bieżący dział widoczny
    if (cur < 0) return;
    // „← poprzedni / następny →” na dole strony
    const pn = document.createElement("div"); pn.className = "prevnext";
    const link = (i, txt) => {
      if (i < 0 || i >= DZIALY.length) return document.createElement("span");
      const a = document.createElement("a");
      a.href = "?p=zadania-wg-typu/" + DZIALY[i][0] + ".md"; a.textContent = txt;
      return a;
    };
    pn.append(link(cur - 1, cur > 0 ? "← " + String(cur).padStart(2, "0") + " " + DZIALY[cur - 1][1] : ""),
              link(cur + 1, cur + 1 < DZIALY.length ? String(cur + 2).padStart(2, "0") + " " + DZIALY[cur + 1][1] + " →" : ""));
    content.append(pn);
  }

  // --- zadania interaktywne ---
  // Odpowiedź bierzemy z istniejącego pola <details> „odpowiedź” (klucz z pliku .md).
  // Po dobrej odpowiedzi pole rozwija się samo i pokazuje wyjaśnienie z klucza.
  const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').trim();
  const OPT_RE = /^\s*([a-gA-G])[).\/]\s/;
  let total = 0, solvedCount = 0;

  // Sama odpowiedź z klucza: pierwsza linia pola, bez wyjaśnienia i tłumaczeń dopisanych po <br>.
  // Dzięki temu dopisanie lub poprawienie wyjaśnienia nie psuje sprawdzania ani zapisanego postępu.
  function answerOf(det) {
    const c = det.cloneNode(true);
    const s = c.querySelector('summary'); if (s) s.remove();
    const br = c.querySelector('br');
    if (br) { while (br.nextSibling) br.nextSibling.remove(); br.remove(); }
    return c.textContent.trim();
  }
  function letterOf(ans) {
    const m = ans.match(/^([a-gA-G])(\s+—|\s*$)/);
    return m ? m[1].toLowerCase() : null;
  }
  function updateScore() {
    const el = document.getElementById('wynik');
    if (!total) return;
    el.hidden = false;
    el.textContent = 'Rozwiązane: ' + solvedCount + ' / ' + total;
  }
  // --- zapamiętywanie postępu w przeglądarce (osobno dla każdej strony) ---
  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('Wyczyścić zapisane odpowiedzi na tej stronie? Inne strony zostaną bez zmian.')) return;
    try { localStorage.removeItem(STORE); } catch (e) {}
    location.reload();
  });
  const STORE = 'postep:' + page;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { saved = {}; }
  const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} };
  const restorers = [];
  const usedKeys = new Set();

  // Zadanie rozpoznajemy po treści (pytanie + odpowiedź z klucza), a nie po kolejności
  // na stronie, żeby poprawki w plikach .md nie przestawiały zapisanych odpowiedzi.
  function itemKey(det) {
    let ctx;
    const li = det.closest('li');
    if (li) {
      const c = li.cloneNode(true);
      c.querySelectorAll('details, ul, input, select').forEach(x => x.remove());
      ctx = c.textContent;
    } else {
      let h = det;
      while (h && !/^H[1-3]$/.test(h.tagName)) h = h.previousElementSibling || h.parentElement;
      ctx = (h ? h.textContent : '') + '#' + det.querySelector('summary').textContent;
    }
    let str = (ctx + '|' + answerOf(det)).replace(/_+/g, '_').replace(/\s+/g, ' ').trim();
    let hsh = 5381;
    for (let i = 0; i < str.length; i++) hsh = ((hsh * 33) ^ str.charCodeAt(i)) >>> 0;
    let key = hsh.toString(36);
    for (let n = 2; usedKeys.has(key); n++) key = hsh.toString(36) + '-' + n;
    usedKeys.add(key);
    return key;
  }

  // Rejestruje zadanie. „restore(wartość)” odtwarza rozwiązanie po powrocie na stronę;
  // zwracana funkcja „solve(wartość)” oznacza zadanie jako rozwiązane i zapisuje postęp.
  function register(det, restore) {
    total++;
    const key = itemKey(det);
    const s = det.querySelector('summary'); if (s) s.textContent = 'pokaż odpowiedź';
    if (restore && key in saved) restorers.push(() => restore(saved[key]));
    let done = false;
    return value => {
      if (done) return;
      done = true; solvedCount++; det.open = true; updateScore();
      saved[key] = value === undefined ? 1 : value; persist();
    };
  }

  // 🔊 przy odpowiedziach do wyboru, żeby odsłuchać wymowę. Wszystkie albo żadna:
  // głośniki są tylko wtedy, gdy co najmniej połowa odpowiedzi w pytaniu jest krótka (1–3 słowa).
  // Nie przy lukach (___) i odpowiedziach po polsku. Kliknięcie głośnika nie wybiera odpowiedzi.
  function addSays(els) {
    if (!synth) return;
    const texts = els.map(el => el.textContent.replace(OPT_RE, '').replace(/[.,;:!?]+$/, '').trim());
    if (texts.some(t => !t || /[_ąćęłńóśźż]/i.test(t))) return;
    const short = texts.filter(t => t.split(/\s+/).length <= 3).length;
    if (short * 2 < texts.length) return;
    els.forEach((el, i) => { if (!el.querySelector('.say')) addSay(el, texts[i]); });
  }
  function addSay(el, text) {
    const s = document.createElement('button');
    s.type = 'button'; s.className = 'say'; s.textContent = '🔊';
    s.setAttribute('aria-label', 'Wymowa: ' + text);
    s.title = 'Posłuchaj wymowy';
    s.addEventListener('click', e => { e.stopPropagation(); say(text); });
    el.append(' ', s);
  }

  // a/b/c/d jako zagnieżdżona lista pod pytaniem
  function setupNestedOptions(li, det, ans) {
    const L = letterOf(ans);
    const opts = [...li.querySelectorAll(':scope > ul > li')].filter(o => OPT_RE.test(o.textContent));
    if (!L || opts.length < 2 || !opts.some(o => o.textContent.trim()[0].toLowerCase() === L)) return false;
    const solve = register(det, () => opts.find(o => o.textContent.trim()[0].toLowerCase() === L).click());
    opts.forEach(o => {
      const l = o.textContent.trim()[0].toLowerCase();
      o.classList.add('opt');
      o.addEventListener('click', () => {
        if (li.classList.contains('done')) return;
        if (l === L) { o.classList.add('ok'); li.classList.add('done'); solve(); }
        else o.classList.add('bad');
      });
    });
    addSays(opts);
    return true;
  }

  // „A. teens B. tiny C. teen” w jednej linii
  function setupInlineOptions(li, det, ans) {
    const L = letterOf(ans);
    const node = [...li.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
    if (!L || !node) return false;
    const text = node.textContent;
    const marks = [...text.matchAll(/(^|\s)([a-gA-G])[.)]\s/g)];
    if (marks.length < 2 || text.slice(0, marks[0].index).trim()) return false;
    if (!marks.some(m => m[2].toLowerCase() === L)) return false;
    let okSpan = null;
    const solve = register(det, () => okSpan && okSpan.click());
    const frag = document.createDocumentFragment();
    const spans = [];
    marks.forEach((m, i) => {
      const start = m.index + m[1].length;
      const end = i + 1 < marks.length ? marks[i + 1].index : text.length;
      const span = document.createElement('span');
      span.className = 'opt'; span.textContent = text.slice(start, end).trim();
      const l = m[2].toLowerCase();
      if (l === L) okSpan = span;
      span.addEventListener('click', () => {
        if (li.classList.contains('done')) return;
        if (l === L) { span.classList.add('ok'); li.classList.add('done'); solve(); }
        else span.classList.add('bad');
      });
      spans.push(span);
      frag.append(span, ' ');
    });
    addSays(spans);
    node.replaceWith(frag);
    return true;
  }

  // **[ X / Y ]** w zdaniu
  function setupTwoChoice(li, det, ans) {
    const strong = [...li.querySelectorAll('strong')].find(s => /^\[ .+ \/ .+ \]$/.test(s.textContent.trim()));
    if (!strong) return false;
    const options = strong.textContent.trim().slice(2, -2).split(' / ').map(s => s.trim());
    const a = norm(ans.replace(/^[a-gA-G]\s+—\s+/, ''));
    let best = null;
    options.forEach(o => {
      const n = norm(o);
      if ((a === n || a.startsWith(n + ' ') || a.startsWith(n + '(')) && (!best || n.length > norm(best).length)) best = o;
    });
    if (!best) return false;
    let okBtn = null;
    const solve = register(det, () => okBtn && okBtn.click());
    strong.textContent = '[ ';
    options.forEach((o, i) => {
      // Ramka (span.pick) mieści słowo do kliknięcia i głośnik — przycisk nie może być w przycisku.
      const box = document.createElement('span');
      box.className = 'pick';
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'pickword'; b.textContent = o;
      if (o === best) okBtn = b;
      b.addEventListener('click', () => {
        if (li.classList.contains('done')) return;
        if (o === best) { box.classList.add('ok'); li.classList.add('done'); solve(); }
        else box.classList.add('bad');
      });
      box.append(b);
      if (synth && !options.some(t => /[_ąćęłńóśźż]/i.test(t))) addSay(box, o);
      strong.append(box, i + 1 < options.length ? ' / ' : ' ]');
    });
    return true;
  }

  // Porównywanie wpisanej odpowiedzi z kluczem: bez wielkich liter i interpunkcji,
  // formy skrócone liczą się tak samo jak pełne (don't = do not, I've = I have).
  // Polskie znaki nie są wymagane (luki po polsku w czytaniu): przyjazn = przyjaźń.
  function normAns(s) {
    return s.toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/\p{M}/gu, '').replace(/[’‘`´]/g, "'")
      .replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'can not')
      .replace(/\bcannot\b/g, 'can not').replace(/\bshan't\b/g, 'shall not')
      .replace(/n't\b/g, ' not').replace(/'ve\b/g, ' have').replace(/'re\b/g, ' are')
      .replace(/'m\b/g, ' am').replace(/'ll\b/g, ' will').replace(/'d\b/g, ' would')
      .replace(/[.,?!;:"„”«»→…]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  // Wariant z klucza → wszystkie dopuszczalne zapisy:
  // „(today)” w nawiasie = może być albo nie, „I/you” bez spacji = jedno albo drugie.
  function expand(v) {
    let outs = [v];
    for (let guard = 0; guard < 4 && outs.some(o => /\([^)]*\)/.test(o)); guard++) {
      outs = outs.flatMap(o => {
        const m = o.match(/\(([^)]*)\)/);
        return m ? [o.replace(m[0], m[1]), o.replace(m[0], ' ')] : [o];
      });
    }
    return outs.flatMap(o => {
      let res = [''];
      for (const t of o.split(/\s+/)) {
        const alts = /\w\/\w/.test(t) ? t.split('/') : [t];
        res = res.flatMap(r => alts.map(x => r + ' ' + x));
      }
      return res;
    });
  }

  function makeInput(width) {
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'gapin';
    input.autocomplete = 'off'; input.spellcheck = false;
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('aria-label', 'Wpisz odpowiedź');
    input.style.width = width + 'em';
    return input;
  }

  // Luki w zadaniu: „________” w tekście albo wzór z literami pomocniczymi `_ t _ i _`.
  function findGaps(li) {
    const gaps = [];
    const walker = document.createTreeWalker(li, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const p = node.parentElement;
      if (p.closest('details, ul, em, strong')) continue;
      if (p.tagName === 'CODE') {
        if (/_/.test(node.textContent)) gaps.push({ code: p });
        continue;
      }
      for (const m of node.textContent.matchAll(/_{4,}/g)) gaps.push({ node, index: m.index, len: m[0].length });
    }
    return gaps;
  }

  // Zamienia lukę na pole. Zwraca pole oraz tekst przed i za luką w tej samej linii.
  function placeInput(gap, width) {
    const input = makeInput(width);
    if (gap.code) {                         // wzór z literami zostaje widoczny, pole stoi obok
      gap.code.after(' ', input);
      return { input, pre: '', post: '' };
    }
    const text = gap.node.textContent;
    const pre = text.slice(0, gap.index).split('\n').pop();
    const post = text.slice(gap.index + gap.len).split('\n')[0];
    const after = gap.node.splitText(gap.index);
    after.textContent = after.textContent.slice(gap.len);
    after.before(input);
    // Wyraz bazowy w nawiasie tuż za luką, np. „(fall)” — wyróżniony, żeby nie ginął w zdaniu.
    const base = after.textContent.match(/^(\s*)\(([^()\n]{1,30})\)/);
    if (base && base[2].trim().split(/\s+/).length <= 3) {
      const rest = after.splitText(base[0].length);
      const b = document.createElement('span');
      b.className = 'baza'; b.textContent = '(' + base[2] + ')';
      after.textContent = base[1];
      rest.before(b);
    }
    // Fragment w nawiasie tuż przed luką, np. „(ma jedenaście lat) ___” albo „(Why / have) ___”.
    const lead = gap.node.textContent.match(/\(([^()\n]{1,40})\)(\s*)$/);
    if (lead && lead[1].trim().split(/\s+/).length <= 6) {
      const mid = gap.node.splitText(lead.index);
      mid.splitText(lead[0].length - lead[2].length);
      const b = document.createElement('span');
      b.className = 'baza'; b.textContent = '(' + lead[1] + ')';
      mid.replaceWith(b);
    }
    return { input, pre, post };
  }

  // Wyraz z literami pomocniczymi, np. `_ t _ i _`: każdy „_” to kratka na jedną literę,
  // podane litery zostają na swoich miejscach. Sprawdza się samo po wypełnieniu kratek.
  function setupLetters(li, det, variants, code) {
    const pattern = code.textContent.replace(/\s+/g, '');
    const flat = s => s.toLowerCase().replace(/[\s-]/g, '');
    const accepted = new Set(variants.flatMap(v => expand(v)).map(flat).filter(w => w.length === pattern.length));
    if (!accepted.size) return false;
    let inputs = [], check = null;
    const solve = register(det, v => {                // odtworzenie: wpisane litery z zapisu
      if (!Array.isArray(v)) return;
      inputs.forEach((inp, i) => { inp.value = v[i] || ''; });
      check();
    });
    const box = document.createElement('span');
    box.className = 'letters';
    const cells = [...pattern].map(ch => {
      if (ch !== '_') {
        const s = document.createElement('span');
        s.className = 'lt fixed'; s.textContent = ch;
        box.append(s); return { fixed: ch };
      }
      const inp = document.createElement('input');
      inp.className = 'lt'; inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('aria-label', 'litera');
      box.append(inp); return { inp };
    });
    inputs = cells.filter(c => c.inp).map(c => c.inp);
    const word = () => cells.map(c => c.fixed || c.inp.value || '_').join('');
    check = () => {
      box.classList.remove('ok', 'bad');
      const w = word();
      if (w.includes('_')) return;
      if (accepted.has(flat(w))) {
        box.classList.add('ok'); inputs.forEach(i => { i.readOnly = true; }); solve(inputs.map(i => i.value));
        // po dobrej odpowiedzi 🔊 za kratkami — wymowa całego wyrazu (z kluczem, np. „guest house”)
        if (synth && !box.nextElementSibling?.classList.contains('say')) {
          const spoken = variants.flatMap(v => expand(v)).find(v => flat(v) === flat(w))?.trim() || w;
          const tmp = document.createElement('span');
          addSay(tmp, spoken);
          box.after(...tmp.childNodes);
        }
      } else box.classList.add('bad');
    };
    inputs.forEach((inp, k) => {
      inp.addEventListener('input', () => {
        const v = inp.value.replace(/[^\p{L}]/gu, '');
        if (v.length > 1) {                       // wklejone całe słowo albo kilka liter
          [...v].forEach((ch, j) => { if (inputs[k + j]) inputs[k + j].value = ch; });
        } else inp.value = v;
        if (inp.value && inputs[k + 1] && !box.classList.contains('ok')) inputs[k + 1].focus();
        check();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && k > 0) {
          e.preventDefault(); inputs[k - 1].value = ''; inputs[k - 1].focus(); check();
        } else if (e.key === 'ArrowLeft' && k > 0) { e.preventDefault(); inputs[k - 1].focus(); }
        else if (e.key === 'ArrowRight' && inputs[k + 1]) { e.preventDefault(); inputs[k + 1].focus(); }
      });
      inp.addEventListener('focus', () => inp.select());
    });
    code.replaceWith(box);
    return true;
  }

  // Wpisywanie odpowiedzi w lukę. „variants” to odpowiedzi z klucza (surowy tekst).
  // „options” (tylko zadania z ramką): wszystkie wyrazy i litery z ramki — pozwala oceniać
  // na bieżąco: zielony = dobrze, czerwony = inny wyraz z ramki, żółty = nie ma tego w ramce.
  function setupTyping(li, det, variants, options, gapsOverride, onOk) {
    const gaps = gapsOverride || findGaps(li);
    if (!gaps.length) return false;
    if (gaps[0].code) return setupLetters(li, det, variants, gaps[0].code);
    // Dwie luki w jednym zdaniu: wariant z klucza dzielimy na „…”, np. „What is … like”.
    const multi = gaps.length > 1 && variants.some(v => v.split('…').length === gaps.length);
    const used = multi ? gaps : [gaps[0]];
    const parts = multi
      ? used.map((_, i) => new Set(variants.flatMap(v => {
          const p = v.split('…'); return p.length === gaps.length ? expand(p[i]).map(normAns) : [];
        })))
      : [new Set(variants.flatMap(v => expand(v)).map(normAns).filter(Boolean))];
    if (!parts[0].size) return false;
    const longest = Math.max(...variants.map(v => v.length));
    // Tylko dwie szerokości, żeby długość pola nie zdradzała długości odpowiedzi.
    const width = multi ? 7 : longest > 14 ? 18 : 8;

    const fields = [];
    const solve = register(det, v => {                // odtworzenie: wpisana odpowiedź z zapisu
      const vals = Array.isArray(v) ? v : [String(v)];
      fields.forEach((f, i) => { f.input.value = vals[i] || ''; });
      check();
    });
    for (let i = used.length - 1; i >= 0; i--) fields.unshift(placeInput(used[i], width));

    const okOne = (f, set) => {
      const v = f.input.value;
      return [v, v + ' ' + f.post, f.pre + ' ' + v, f.pre + ' ' + v + ' ' + f.post].some(x => set.has(normAns(x)));
    };
    const mark = cls => fields.forEach(f => {
      f.input.classList.remove('ok', 'bad', 'part');
      if (cls) f.input.classList.add(cls);
    });
    const isOk = () => fields.every((f, i) => okOne(f, parts[i]));
    const win = () => {
      mark('ok'); fields.forEach(f => { f.input.readOnly = true; }); solve(fields.map(f => f.input.value));
      if (onOk) onOk(fields[0].input.value);
      // po dobrej odpowiedzi 🔊 za polem — wymowa wpisanego tekstu. Nie w lukach w tekstach do
      // czytania (gapsOverride): tam odpowiedzi są po polsku.
      // Całe zdanie z wpisaną odpowiedzią (bez nawiasów z podpowiedziami, „→”, „A:/B:”).
      const clean = s => s.replace(/\([^)]*\)/g, ' ').replace(/_+/g, ' ').replace(/^\s*(→|[AB]:)\s*/, '')
        .replace(/\s+([.,!?])/g, '$1').replace(/\s+/g, ' ').trim();
      const spoken = clean(fields[0].pre + fields.map(f => ' ' + f.input.value + ' ' + f.post).join(''));
      const last = fields[fields.length - 1].input;
      if (synth && !gapsOverride && !fields.some(f => /[ąćęłńóśźż]/i.test(f.input.value)) && !last.nextElementSibling?.classList.contains('say')) {
        const tmp = document.createElement('span');
        addSay(tmp, spoken);
        last.after(...tmp.childNodes);
      }
    };
    // Enter / wyjście z pola: ocena ostateczna
    const check = () => {
      if (fields.some(f => f.input.readOnly)) return;
      if (fields.some(f => !f.input.value.trim())) return mark(null);
      if (isOk()) return win();
      mark(options && !options.has(normAns(fields[0].input.value)) ? 'part' : 'bad');
    };
    // W trakcie pisania: dobra odpowiedź od razu na zielono; w ramce także czerwony/żółty
    const live = () => {
      if (fields.some(f => f.input.readOnly)) return;
      if (fields.some(f => !f.input.value.trim())) return mark(null);
      if (isOk()) return win();
      if (!options) return mark(null);
      mark(options.has(normAns(fields[0].input.value)) ? 'bad' : 'part');
    };
    fields.forEach(f => {
      f.input.addEventListener('input', live);
      f.input.addEventListener('change', check);
      f.input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
    });
    return true;
  }

  // Ramka = tabela HTML bez nagłówka (ramki z wyrazami): wyrazy, komórki i to, czy wyrazy
  // się wykluczają. Jeśli polecenie mówi „więcej niż raz”, wykorzystanych nie skreślamy.
  function boxOf(table) {
    if (table.querySelector('th')) return null;
    const tds = [...table.querySelectorAll('td')];
    const texts = tds.map(td => {
      const c = td.cloneNode(true);
      c.querySelectorAll('.tr, .say').forEach(x => x.remove());   // bez dymka z tłumaczeniem
      return c.textContent.replace(/\s+/g, ' ').trim();
    });
    if (!texts.length || texts.some(t => t.length > 40)) return null;
    const prev = table.previousElementSibling;
    return {
      words: new Set(texts.map(normAns)),
      cells: tds.map((td, i) => ({ td, key: normAns(texts[i]) })),
      need: new Map(), done: new Map(),   // ile luk potrzebuje wyrazu / ile już rozwiązano
    };
  }
  // Wyszarza w ramce wyraz, który został wpisany. Jeśli wyraz jest w ramce tyle razy, ile luk
  // go potrzebuje, skreślamy po jednym egzemplarzu na każdą lukę. Jeśli luk jest więcej niż
  // egzemplarzy (ramka „wyrazów możesz użyć więcej niż raz”), wyraz szarzeje dopiero wtedy,
  // gdy nie jest już potrzebny w żadnej luce.
  function useCell(box, word) {
    const key = normAns(word);
    const copies = box.cells.filter(c => c.key === key);
    const done = (box.done.get(key) || 0) + 1;
    box.done.set(key, done);
    const need = box.need.get(key) || 0;
    const grey = need <= copies.length ? done : (done >= need ? copies.length : 0);
    copies.slice(0, grey).forEach(c => c.td.classList.add('used'));
  }

  // Odpowiedzi uznawane w kluczu → lista wariantów (surowy tekst, rozwijany potem przez expand):
  // „solution / solutions”, „at (klucz uznaje też: before, after)”, „(today)” jako część
  // opcjonalna. Uwagi po „⚠” i „ — ” oraz dopiski po polsku w nawiasach pomijamy.
  function acceptedOf(ans) {
    let a = ans.split('⚠')[0].split(' — ')[0];
    const extra = [];
    a = a.replace(/\(([^)]*)\)/g, (m, inner) => {
      const t = inner.match(/^\s*(?:klucz uznaje też|też)\s*:\s*(.*)$/i);
      if (t) { extra.push(...t[1].split(/\s*[,/]\s*/)); return ' '; }
      if (/[:=ąćęłńóśźż]/i.test(inner) || inner.trim().split(/\s+/).length > 4) return ' ';
      return m;                              // np. „(today)” — część opcjonalna
    });
    return [...a.split(/\s+\/\s+/), ...extra].map(v => v.trim()).filter(Boolean);
  }

  function enhanceExercises(root) {
    // Ramki: elementy po tabeli aż do następnego nagłówka.
    const boxFor = new Map();
    root.querySelectorAll('table').forEach(t => {
      const box = boxOf(t); if (!box) return;
      for (let el = t.nextElementSibling; el && !/^(H[1-3]|TABLE)$/.test(el.tagName); el = el.nextElementSibling) {
        el.querySelectorAll('li').forEach(li => boxFor.set(li, box));
      }
    });

    root.querySelectorAll('li').forEach(li => {
      const det = li.querySelector(':scope > details');
      if (!det) return;
      const ans = answerOf(det);
      if (setupNestedOptions(li, det, ans) || setupTwoChoice(li, det, ans) || setupInlineOptions(li, det, ans)) return;
      // Sekcje oznaczone w .md jako <div class="wpisz"> — wpisywanie bez ramki, odpowiedzi z klucza.
      if (li.closest('.wpisz')) { setupTyping(li, det, acceptedOf(ans)); return; }
      const box = boxFor.get(li);
      if (!box) return;
      // W lukę wpisuje się wyraz z ramki (bez dopisków typu „(niewykorzystane: …)”).
      const accepted = acceptedOf(ans).filter(w => box.words.has(normAns(w)));
      if (!accepted.length) return;
      const k = normAns(accepted[0]);
      box.need.set(k, (box.need.get(k) || 0) + 1);
      setupTyping(li, det, accepted, box.words, null, v => useCell(box, v));
    });

    // Teksty z lukami, w których opcje są w liście pod tekstem („Luka (54):” + a/b/c/d):
    // wybór przenosimy w miejsce luki w tekście. Pozycja w liście zostaje (z odpowiedzią
    // i wyjaśnieniem), ale bez opcji. Kliknięcie w tekście = kliknięcie opcji w liście,
    // więc sprawdzanie i zapisany postęp działają tak samo.
    root.querySelectorAll('li').forEach(li => {
      const m = li.textContent.match(/^\s*Luka \((\d+)\)/);
      if (!m) return;
      const opts = [...li.querySelectorAll(':scope > ul > li.opt')];
      if (opts.length < 2) return;
      const gapRe = new RegExp('\\(' + m[1] + '\\)\\s*_{3,}');
      let node = null;
      for (let p = li.parentElement.previousElementSibling; p && !node && !/^(H[1-3]|HR)$/.test(p.tagName); p = p.previousElementSibling) {
        const w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
        while (w.nextNode()) if (gapRe.test(w.currentNode.textContent)) { node = w.currentNode; break; }
      }
      if (!node) return;
      const texts = opts.map(o => {
        const c = o.cloneNode(true);
        c.querySelectorAll('.say').forEach(x => x.remove());
        return c.textContent.replace(OPT_RE, '').trim();
      });
      const speak = synth && !texts.some(t => /[_ąćęłńóśźż]/i.test(t));
      const strong = document.createElement('strong');
      strong.append('[ ');
      texts.forEach((t, i) => {
        const box = document.createElement('span');
        box.className = 'pick';
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'pickword'; b.textContent = t;
        b.addEventListener('click', () => opts[i].click());
        // stan z listy (też po odtworzeniu postępu) przenosimy na ramkę w tekście
        opts[i].addEventListener('click', () => {
          box.classList.toggle('ok', opts[i].classList.contains('ok'));
          box.classList.toggle('bad', opts[i].classList.contains('bad'));
        });
        box.append(b);
        if (speak) addSay(box, t);
        strong.append(box, i + 1 < texts.length ? ' / ' : ' ]');
      });
      const mm = node.textContent.match(gapRe);
      const after = node.splitText(mm.index);
      after.textContent = after.textContent.slice(mm[0].length);
      after.before('(' + m[1] + ') ', strong);
      li.querySelector(':scope > ul').hidden = true;
    });

    // Czytanie: odpowiedzi 1–5 zebrane pod tekstem w osobnych polach <details>.
    const gapDets = [];   // luki w tekście (wybór fragmentu albo wpisywanie)
    root.querySelectorAll('details').forEach(det => {
      if (det.closest('li')) return;
      const n = parseInt(det.querySelector('summary')?.textContent, 10);
      if (!n) return;
      const L = letterOf(answerOf(det));
      if (!L) { gapDets.push(det); return; }
      // Pytania a/b/c/d w liście nad odpowiedziami → klikane warianty.
      let el = det.previousElementSibling;
      while (el && !/^(OL|H[1-3]|HR)$/.test(el.tagName)) el = el.previousElementSibling;
      if (el && el.tagName === 'OL') {
        const li = el.children[n - 1];
        if (li && !li.querySelector(':scope > details') && setupNestedOptions(li, det, answerOf(det))) return;
      }
      // Luki z fragmentami a–g → rozwijana lista w miejscu luki (obsługa niżej, razem z wpisywaniem).
      gapDets.push(det);
    });

    // Fragmenty „a) …” do wstawienia: z tabelki „Fragmenty do wstawienia” nad odpowiedziami.
    function fragmentsBefore(det) {
      for (let p = det.previousElementSibling; p && !/^(H[1-3]|HR)$/.test(p.tagName); p = p.previousElementSibling) {
        if (p.tagName !== 'TABLE') continue;
        const rows = [...p.querySelectorAll('tr')].map(tr => [...tr.cells].map(c => c.textContent.trim()))
          .filter(r => /^[a-g]\)$/.test(r[0]));
        if (rows.length >= 3) { const fr = rows.map(r => [r[0][0], r[1]]); fr.table = p; return fr; }
      }
      return null;
    }

    const selGroups = new Map();   // tabelka fragmentów → listy przy lukach tego tekstu
    function placeSelect(gap, frags, L, solve) {
      const sel = document.createElement('select');
      sel.className = 'gapsel';
      sel.setAttribute('aria-label', 'Wybierz fragment');
      sel.append(new Option('wybierz fragment', ''));
      frags.forEach(([l, t]) => sel.append(new Option(l + ') ' + t, l)));
      sel.addEventListener('change', () => {
        sel.classList.remove('ok', 'bad');
        if (!sel.value) return;
        if (sel.value === L) {
          sel.classList.add('ok'); sel.disabled = true; solve();
          // fragment wykorzystany → na pozostałych listach tego tekstu nie da się go już wybrać
          selGroups.get(frags.table).forEach(other => {
            if (other === sel) return;
            const o = [...other.options].find(o => o.value === L);
            if (o) { o.disabled = true; o.textContent = '✔ ' + o.textContent + ' (już wstawiony)'; }
            if (other.value === L && !other.disabled) { other.value = ''; other.classList.remove('bad'); }
          });
        }
        else sel.classList.add('bad');
      });
      const after = gap.node.splitText(gap.index);
      after.textContent = after.textContent.slice(gap.len);
      after.before(sel);
      if (!selGroups.has(frags.table)) selGroups.set(frags.table, []);
      selGroups.get(frags.table).push(sel);
      return sel;
    }

    // Luki w tekście: od końca, żeby wstawienie pola nie przesuwało pozostałych luk w akapicie.
    gapDets.reverse().forEach(det => {
      const n = parseInt(det.querySelector('summary').textContent, 10);
      const els = [];
      for (let p = det.previousElementSibling; p && !/^(H[1-3]|HR)$/.test(p.tagName); p = p.previousElementSibling) els.unshift(p);
      const gap = els.flatMap(e => findGaps(e)).filter(g => g.node)[n - 1];
      if (!gap) return;
      const ans = answerOf(det);
      const L = letterOf(ans);
      if (L) {                                  // wybór fragmentu a–g
        const frags = fragmentsBefore(det);
        if (!frags || !frags.some(f => f[0] === L)) return;
        let sel = null;
        const solve = register(det, () => { sel.value = L; sel.dispatchEvent(new Event('change')); });
        sel = placeSelect(gap, frags, L, solve);
      } else if (!setupTyping(null, det, acceptedOf(ans), null, [gap])) return;   // wpisywanie (np. po polsku)
      det.querySelector('summary').textContent = 'pokaż odpowiedź do luki ' + n;
    });
    restorers.forEach(r => { try { r(); } catch (e) {} });
    updateScore();
    if (total) document.getElementById('reset').hidden = false;
  }

  fetch(encodeURI(page))
    .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
    .then(md => {
      content.innerHTML = marked.parse(md, { gfm: true });
      content.querySelectorAll('h1, h2, h3, h4').forEach(h => { if (!h.id) h.id = slug(h.textContent); });
      fixLinks(content);
      enhanceWords(content);
      enhanceExercises(content);
      // 🔊 w ramce z wyrazem bazowym <kbd> (słowotwórstwo). Dodawane po zadaniach,
      // żeby głośnik nie wchodził do tekstu, po którym rozpoznajemy zapisany postęp.
      if (synth) content.querySelectorAll('kbd').forEach(k => addSay(k, k.textContent.trim()));
      addSectionNav();
      const hdr = () => document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
      hdr(); window.addEventListener("resize", hdr);
      const h1 = content.querySelector('h1');
      if (h1) document.title = h1.textContent;
      if (location.hash) {
        const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (el) el.scrollIntoView();
      }
    })
    .catch(err => {
      content.innerHTML = '<p id="error"></p>';
      content.firstChild.textContent = 'Nie udało się wczytać strony „' + page + '” (' + err.message + ').';
    });
})();
</script>
</body>
</html>
